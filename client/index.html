<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9to5Wrapped - You do the work, the app does the talking</title>
    <script>
      (function() {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <script>
      window.addEventListener('error', function(event) {
        var errorDiv = document.getElementById('global-error-screen');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'global-error-screen';
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.height = '100%';
          errorDiv.style.backgroundColor = '#fee2e2';
          errorDiv.style.color = '#991b1b';
          errorDiv.style.padding = '24px';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.overflow = 'auto';
          errorDiv.style.boxSizing = 'border-box';
          document.body.appendChild(errorDiv);
        }
        errorDiv.innerHTML = '<h1>Global Javascript Error Caught</h1><p><strong>' + event.message + '</strong></p><p>File: ' + event.filename + ':' + event.lineno + ':' + event.colno + '</p><pre>' + (event.error ? event.error.stack : '') + '</pre>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        var errorDiv = document.getElementById('global-error-screen');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'global-error-screen';
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.height = '100%';
          errorDiv.style.backgroundColor = '#fee2e2';
          errorDiv.style.color = '#991b1b';
          errorDiv.style.padding = '24px';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.overflow = 'auto';
          errorDiv.style.boxSizing = 'border-box';
          document.body.appendChild(errorDiv);
        }
        var reason = event.reason;
        var message = reason ? (reason.message || reason) : 'Unknown reason';
        var stack = reason && reason.stack ? reason.stack : '';
        errorDiv.innerHTML = '<h1>Unhandled Promise Rejection</h1><p><strong>' + message + '</strong></p><pre>' + stack + '</pre>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
