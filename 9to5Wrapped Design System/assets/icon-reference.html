<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9to5Wrapped — Iconography (lucide)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--bg); padding: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .ico {
    display: grid; place-items: center; gap: 8px;
    padding: 16px 8px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text);
  }
  .ico i { width: 22px; height: 22px; color: var(--accent); }
  .ico span { font-size: 0.72rem; color: var(--text-3); font-weight: 600; }
</style>
</head>
<body class="surface-grid">
  <div class="grid" id="grid"></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    const icons = ['sparkles','wand-sparkles','list-checks','list-tree','alarm-clock','rotate-ccw',
      'file-plus-2','plus','trash-2','save','download','file-down','copy','check','columns-3','eye',
      'x','arrow-right','moon','sun','briefcase-business','file-text'];
    const grid = document.getElementById('grid');
    grid.innerHTML = icons.map(n => `<div class="ico"><i data-lucide="${n}"></i><span>${n}</span></div>`).join('');
    lucide.createIcons();
  </script>
</body>
</html>
