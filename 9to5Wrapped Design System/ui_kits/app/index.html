<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9to5Wrapped — App UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Unbounded:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  /* Type direction layered over the production CSS:
     Unbounded display headlines + Playfair editorial body. */
  :root { --kit-display: "Unbounded", "Inter", ui-sans-serif, sans-serif;
          --kit-serif: "Playfair Display", Georgia, serif; }
  .auth-copy h1, .section-heading h1, .result-heading h2,
  .onboarding-panel h1, .report-modal h2 {
    font-family: var(--kit-display);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.06;
  }
  .brand strong { font-family: var(--kit-display); font-weight: 700; }
  .auth-copy p { font-family: var(--kit-serif); font-size: 1.14rem; line-height: 1.62; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="spotlight.js"></script>
  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="Topbar.jsx"></script>
  <script type="text/babel" src="ProfileFields.jsx"></script>
  <script type="text/babel" src="AuthScreen.jsx"></script>
  <script type="text/babel" src="OnboardingScreen.jsx"></script>
  <script type="text/babel" src="TaskCard.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    window.addEventListener('load', function () {
      if (window.AutoPilotSpotlight) window.AutoPilotSpotlight({ glowColor: '132, 0, 255', spotlightRadius: 320 });
    });
  </script>
</body>
</html>
