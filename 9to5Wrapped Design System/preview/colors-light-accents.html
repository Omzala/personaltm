<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);padding:24px 28px}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{border-radius:12px;overflow:hidden;border:1px solid var(--border)}
  .chip{height:64px}
  .meta{padding:8px 10px;background:var(--surface);display:grid;gap:1px}
  .meta b{font-size:0.76rem;color:var(--text);font-weight:700}
  .meta code{font-family:var(--font-mono);font-size:0.64rem;color:var(--text-3)}
</style></head>
<body class="surface-grid">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#ff4d6d"></div><div class="meta"><b>pink</b><code>#ff4d6d</code></div></div>
    <div class="sw"><div class="chip" style="background:#23d5ab"></div><div class="meta"><b>teal</b><code>#23d5ab</code></div></div>
    <div class="sw"><div class="chip" style="background:#b8f563"></div><div class="meta"><b>lime</b><code>#b8f563</code></div></div>
    <div class="sw"><div class="chip" style="background:#ffd166"></div><div class="meta"><b>yellow</b><code>#ffd166</code></div></div>
    <div class="sw"><div class="chip" style="background:#8b5cf6"></div><div class="meta"><b>purple</b><code>#8b5cf6</code></div></div>
  </div>
</body></html>
