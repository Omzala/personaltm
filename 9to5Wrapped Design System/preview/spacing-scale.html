<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);padding:24px 28px}
  .scale{display:grid;gap:9px}
  .r{display:flex;align-items:center;gap:14px;font-size:0.74rem;color:var(--text-3);font-family:var(--font-mono)}
  .bar{height:14px;background:var(--accent);border-radius:3px}
  .r b{width:64px;color:var(--text);font-family:var(--font-sans);font-weight:700;font-size:0.78rem}
</style></head>
<body class="surface-grid">
  <div class="scale">
    <div class="r"><b>space-1</b><span class="bar" style="width:4px"></span>4px</div>
    <div class="r"><b>space-2</b><span class="bar" style="width:8px"></span>8px</div>
    <div class="r"><b>space-3</b><span class="bar" style="width:12px"></span>12px</div>
    <div class="r"><b>space-4</b><span class="bar" style="width:16px"></span>16px</div>
    <div class="r"><b>space-6</b><span class="bar" style="width:24px"></span>24px · panel padding</div>
    <div class="r"><b>space-8</b><span class="bar" style="width:32px"></span>32px · grid unit</div>
  </div>
</body></html>
