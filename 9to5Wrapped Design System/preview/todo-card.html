<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);padding:22px 28px}
  .card{border:2px solid var(--teal);border-radius:14px;padding:16px;
    background:var(--surface);box-shadow:0 0 0 4px rgba(35,213,171,0.1),var(--shadow-sm);
    max-width:560px;display:grid;gap:10px}
  .top{display:flex;gap:8px}
  .sel{border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:0.82rem;font-weight:700;
    color:var(--text-2);background:var(--surface-input)}
  .sel.status{border-left:3px solid var(--teal);color:var(--text)}
  .title{font-size:1rem;font-weight:800;color:var(--text)}
  .desc{font-size:0.88rem;color:var(--text-2);line-height:1.5}
</style></head>
<body class="surface-grid">
  <article class="card">
    <div class="top"><span class="sel status">In progress</span><span class="sel">High</span><span class="sel">Execution</span></div>
    <div class="title">Ship the new auth flow</div>
    <div class="desc">Wire Google OAuth + email fallback, then QA the carryover edge cases before release.</div>
  </article>
</body></html>
