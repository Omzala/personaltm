<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);padding:26px 28px}
  .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .box{background:var(--surface);border:1.5px solid var(--border-hover);display:grid;place-items:center}
  .lab{display:grid;gap:3px;text-align:center}
  .lab b{font-size:0.78rem;color:var(--text);font-weight:700}
  .lab code{font-family:var(--font-mono);font-size:0.66rem;color:var(--text-3)}
</style></head>
<body class="surface-grid">
  <div class="row">
    <div class="lab"><div class="box" style="width:60px;height:60px;border-radius:10px"></div><b>input/btn</b><code>10px</code></div>
    <div class="lab"><div class="box" style="width:60px;height:60px;border-radius:12px"></div><b>chip</b><code>12px</code></div>
    <div class="lab"><div class="box" style="width:60px;height:60px;border-radius:14px"></div><b>card</b><code>14px</code></div>
    <div class="lab"><div class="box" style="width:60px;height:60px;border-radius:16px"></div><b>panel</b><code>16px</code></div>
    <div class="lab"><div class="box" style="width:60px;height:60px;border-radius:18px"></div><b>modal</b><code>18px</code></div>
    <div class="lab"><div class="box" style="width:60px;height:36px;border-radius:100px"></div><b>tag</b><code>pill</code></div>
  </div>
</body></html>
