<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);padding:24px 28px}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{border-radius:12px;overflow:hidden;border:1px solid var(--border)}
  .chip{height:64px}
  .meta{padding:8px 10px;background:#0c0c1e;display:grid;gap:1px}
  .meta b{font-size:0.76rem;color:#eeeeff;font-weight:700}
  .meta code{font-family:var(--font-mono);font-size:0.64rem;color:#8888b8}
</style></head>
<body class="surface-grid">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#07070f"></div><div class="meta"><b>bg</b><code>#07070f</code></div></div>
    <div class="sw"><div class="chip" style="background:#0a0a18"></div><div class="meta"><b>surface</b><code>navy glass</code></div></div>
    <div class="sw"><div class="chip" style="background:#16162e"></div><div class="meta"><b>surface-3</b><code>#16162e</code></div></div>
    <div class="sw"><div class="chip" style="background:#eeeeff"></div><div class="meta"><b>text</b><code>#eeeeff</code></div></div>
    <div class="sw"><div class="chip" style="background:#8888b8"></div><div class="meta"><b>text-2</b><code>#8888b8</code></div></div>
  </div>
</body></html>
