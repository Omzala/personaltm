<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);padding:26px 30px;color:var(--text)}
  .stack{display:grid;gap:13px;max-width:580px}
  .tag{font-family:var(--font-mono);font-size:0.68rem;color:var(--text-3)}
  .line{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  .serif{font-family:var(--font-serif)}
  .body-serif{font-family:var(--font-serif);font-size:1.18rem;line-height:1.6;color:var(--text-2);margin:0}
  .label-serif{font-family:var(--font-serif);font-size:1rem;font-weight:600;color:var(--text-label)}
</style></head>
<body class="surface-grid">
  <div class="stack">
    <div class="line"><span class="t-eyebrow">Saved reports</span><span class="tag">eyebrow · Inter 850 · uppercase</span></div>
    <div class="line"><span class="label-serif">Key responsibility</span><span class="tag">label · Playfair 600</span></div>
    <p class="body-serif">Enter simple time and task rows, then generate a polished report matched to your role, seniority, and manager expectations.</p>
    <div class="line"><span class="serif" style="font-style:italic;color:var(--text-3)">3 tasks · In progress</span><span class="tag">meta · Playfair italic</span></div>
  </div>
</body></html>
