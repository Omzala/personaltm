<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);padding:24px 28px}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{border-radius:12px;overflow:hidden;border:1px solid var(--border)}
  .chip{height:64px}
  .meta{padding:8px 10px;background:#0c0c1e;display:grid;gap:1px}
  .meta b{font-size:0.76rem;color:#eeeeff;font-weight:700}
  .meta code{font-family:var(--font-mono);font-size:0.64rem;color:#8888b8}
</style></head>
<body class="surface-grid">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#ff0080;box-shadow:0 0 24px rgba(255,0,128,0.5) inset"></div><div class="meta"><b>neon pink</b><code>#ff0080</code></div></div>
    <div class="sw"><div class="chip" style="background:#00ff87;box-shadow:0 0 24px rgba(0,255,135,0.5) inset"></div><div class="meta"><b>neon green</b><code>#00ff87</code></div></div>
    <div class="sw"><div class="chip" style="background:#00d4ff;box-shadow:0 0 24px rgba(0,212,255,0.5) inset"></div><div class="meta"><b>cyan</b><code>#00d4ff</code></div></div>
    <div class="sw"><div class="chip" style="background:#ffcc00;box-shadow:0 0 24px rgba(255,204,0,0.5) inset"></div><div class="meta"><b>yellow</b><code>#ffcc00</code></div></div>
  </div>
</body></html>
