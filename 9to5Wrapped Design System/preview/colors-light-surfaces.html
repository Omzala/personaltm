<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);padding:24px 28px}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{border-radius:12px;overflow:hidden;border:1px solid var(--border)}
  .chip{height:64px}
  .meta{padding:8px 10px;background:var(--surface);display:grid;gap:1px}
  .meta b{font-size:0.76rem;color:var(--text);font-weight:700}
  .meta code{font-family:var(--font-mono);font-size:0.64rem;color:var(--text-3)}
</style></head>
<body class="surface-grid">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#f4f5ea"></div><div class="meta"><b>bg</b><code>#f4f5ea</code></div></div>
    <div class="sw"><div class="chip" style="background:#ffffff"></div><div class="meta"><b>surface</b><code>#ffffff</code></div></div>
    <div class="sw"><div class="chip" style="background:#f0f1e8"></div><div class="meta"><b>surface-2</b><code>#f0f1e8</code></div></div>
    <div class="sw"><div class="chip" style="background:#e6e8db"></div><div class="meta"><b>surface-3</b><code>#e6e8db</code></div></div>
    <div class="sw"><div class="chip" style="background:#12131c"></div><div class="meta"><b>text / ink</b><code>#12131c</code></div></div>
  </div>
</body></html>
